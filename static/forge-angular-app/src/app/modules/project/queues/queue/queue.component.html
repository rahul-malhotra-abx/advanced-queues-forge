<h1 mat-dialog-title>
  <i class="fa fa-pencil-alt text-black-50"></i>
  &nbsp;
  <span class="text-muted">{{ newQueue ? 'New' : 'Edit' }} Queue:</span>
  <span>{{ queue.name }}</span>
</h1>
<div mat-dialog-content class="pb-2" *ngIf="pageLoaded">
  <div class="row">
    <div class="col-12 mb-3">
      <div class="row">
        <div class="col-6">
          <label for="queue-name" class="form-label">
            Name
            <span ngbTooltip="Required Field" class="text-danger">*</span>
          </label>
          <input
            class="form-control"
            placeholder="Name your queue."
            id="queue-name"
            name="queue-name"
            autocomplete="off"
            [(ngModel)]="queue.name"
            [maxlength]="DefaultLimits.QUEUE_NAME" />
        </div>
        <div class="col-3">
          <label for="queue-name" class="form-label">
            Scope
            <span ngbTooltip="Required Field" class="text-danger">*</span>
            <i
              ngbTooltip="Scopes defines the visibility of the queue. Project queues are visible to everyone in the project, where as personal queues are visible to you."
              class="ms-2 fa fa-info-circle"></i>
          </label>
          <select class="form-select" [(ngModel)]="queue.scope" [disabled]="!dataFromPatent.newQueue">
            <option [value]="QueueScopes.PERSONAL">Personal</option>
            <option [value]="QueueScopes.PROJECT" [disabled]="!isAdmin">Project</option>
          </select>
        </div>
        <div class="col-3">
          <label for="queue-priority" class="form-label">
            Priority
            <span ngbTooltip="Required Field" class="text-danger">*</span>
          </label>
          <mat-select name="queue-priority" [(ngModel)]="queue.priority" id="queue-priority">
            <mat-option *ngFor="let priority of priorityList" [value]="priority">
              <i class="{{ UtilsService.getPriorityIcon(priority) }} Priority-{{ priority }} me-2"></i>
              {{ priority }}
            </mat-option>
          </mat-select>
        </div>
      </div>
    </div>
    <div class="col-12 mb-3">
      <label for="queue-jql" class="form-label w-100">
        Columns
        <span ngbTooltip="Required Field" class="text-danger">*</span>
        <button class="btn btn-link float-end text-decoration-none p-0" (click)="toggleReorderColumns()">
          {{ reorderingColumns ? 'Done' : 'Reorder Columns' }}
        </button>
      </label>
      <div *ngIf="reorderingColumns" class="reordering-container">
        <ul class="list-group" cdkDropList (cdkDropListDropped)="onColumnDrop($event)">
          <li class="list-group-item" *ngFor="let column of selectedColumns" cdkDrag cdkDragLockAxis="y" cdkDragHandle>{{ column.name }}</li>
        </ul>
      </div>
      <ng-multiselect-dropdown
        *ngIf="!reorderingColumns"
        class="jira-column-selection"
        name="queue-columns"
        [placeholder]="'Select Columns &nbsp;'"
        [settings]="defaultDropdownSettings"
        [data]="availableColumns"
        [(ngModel)]="selectedColumns"
        (onSelect)="columnSelectionUpdated('add', $event)"
        (onDeSelect)="columnSelectionUpdated('remove', $event)"></ng-multiselect-dropdown>
    </div>
    <div class="col-12 mb-3">
      <label for="queue-jql" class="form-label w-100">
        JQL
        <span ngbTooltip="Required Field" class="text-danger">*</span>
        <div class="d-flex justify-content-end gap-3">
          <button class="btn btn-link float-end text-decoration-none p-0" (click)="openJQLEditor()">Use JQL Builder</button>
          <button class="btn btn-link float-end text-decoration-none p-0" (click)="toggleSavedFilters()">Saved Filters</button>
        </div>
      </label>
      <textarea
        class="form-control"
        placeholder="JQL filter for queue."
        id="queue-jql"
        name="queue-jql"
        autocomplete="off"
        [(ngModel)]="queue.jql"></textarea>
              <!-- Conditional display based on Saved Filters vs JQL -->
      <ng-container *ngIf="isSavedFilterSelected">
        <!-- Autocomplete for Saved Filters -->
        <mat-form-field class="w-100">
          <input matInput placeholder="Search Saved Filters" [matAutocomplete]="auto" [(ngModel)]="selectedFilterValue">
          <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onFilterSelected($event)">
            <mat-option *ngFor="let filter of filteredFilters" [value]="filter">
              {{ filter.name }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </ng-container>
    </div>
    <div class="accordion" id="advancedOptionsAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header" id="advancedOptions">
          <button
            class="accordion-button collapsed"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#advancedOptionsAccordionBox"
            aria-expanded="false"
            aria-controls="collapseOne">
            Advanced Options
          </button>
        </h2>
        <div
          id="advancedOptionsAccordionBox"
          class="accordion-collapse collapsed collapse"
          aria-labelledby="advancedOptions"
          data-bs-parent="#advancedOptionsAccordion">
          <div class="accordion-body row">
            <!-- <div class="col-12 mb-3">
              <label for="queue-visibility-group" class="form-label">Visibility Group</label>
              <ng-multiselect-dropdown
                class="ms-2 jira-column-selection"
                name="queue-visibility-group"
                [disabled]="queue.scope === QueueScopes.PERSONAL"
                [placeholder]="'Select Groups &nbsp;'"
                [settings]="defaultJiraGroupDropdownSettings"
                [data]="availableJiraGroups"
                [(ngModel)]="selectedJiraGroups"
                (onFilterChange)="searchJiraGroupChanged($event)"
                (onSelect)="jiraGroupSelectionUpdated('add', $event)"
                (onDeSelect)="jiraGroupSelectionUpdated('remove', $event)"></ng-multiselect-dropdown>
            </div> -->
            <div class="col-12 mb-3" *ngIf="newQueue">
              <label class="form-label">Import Into Folder</label>
              <select [(ngModel)]="importIntoFolder" class="form-select">
                <ng-container *ngFor="let folder of folders">
                  <option *ngIf="folder.scope === queue.scope" [ngValue]="folder">{{ folder.name }}</option>
                </ng-container>
              </select>
            </div>
            <div class="col-12 mb-3">
              <label for="queue-jql" class="form-label">Description</label>
              <textarea
                class="form-control"
                placeholder="Description for queue."
                id="queue-description"
                rows="1"
                name="queue-description"
                autocomplete="off"
                [(ngModel)]="queue.description"></textarea>
            </div>
            <div class="col-12 mb-3">
              <label for="queue-jql" class="form-label">Alert</label>
              <select class="form-select" [(ngModel)]="queue.alertLevel">
                <option *ngFor="let level of alertLevels" [value]="level.value">{{ level.label }}</option>
              </select>
              <textarea
                class="form-control"
                placeholder="Alert for queue. Supports Markdown"
                id="queue-alert"
                name="queue-alert"
                autocomplete="off"
                [(ngModel)]="queue.alert"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div mat-dialog-actions class="clearfix float-end">
  <button class="btn btn-link text-dark text-decoration-none me-2" (click)="cancelEditing()">Cancel</button>
  <button class="btn btn-primary" (click)="clickOk()">{{ dataFromPatent.newQueue ? 'Create' : 'Save' }}</button>
</div>
