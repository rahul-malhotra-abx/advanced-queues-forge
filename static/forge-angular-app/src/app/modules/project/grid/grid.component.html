<div *ngIf="loadingIssues">
  <div class="progress mt-3">
    <div
      class="progress-bar progress-bar-striped progress-bar-animated"
      role="progressbar"
      aria-valuenow="75"
      aria-valuemin="0"
      aria-valuemax="100"
      [style]="'width:' + loadingProgressBarWidth + '%'"></div>
  </div>
  <p class="text-center">{{ loadingMessage }}</p>
</div>
<div class="grid-container" *ngIf="!loadingIssues">
  <div class="clearfix py-3">
    <div class="float-start d-flex">
      <input type="text" class="form-control me-2" placeholder="Quick Filter..." (keyup)="onFilterTextBoxChanged($event)" />
    </div>
    <div class="d-flex justify-content-end">
      <p class="align-self-center pe-2 mb-0 text-muted">Page Size</p>
      <select [(ngModel)]="queueGridOptions.pageSize" (ngModelChange)="onPageSizeChanged()" class="form-select w-auto me-2">
        <option *ngFor="let gridSize of GRID_PAGE_SIZES" [ngValue]="gridSize">{{ gridSize }}</option>
      </select>
      <button class="btn btn-outline-success ms-2" (click)="search()" ngbTooltip="Refresh Issues">
        <i class="fa fa-sync-alt"></i>
      </button>
    </div>
  </div>

  <ag-grid-angular
    style="width: 100%"
    class="ag-theme-balham prioritization-grid"
    [frameworkComponents]="frameworkComponents"
    [gridOptions]="gridOptions"
    [enableCellChangeFlash]="true"
    (gridReady)="onGridReady($event)"
    [domLayout]="'normal'"
    (columnResized)="onColumnResized($event)"
    (columnMoved)="onColumnMoved($event)"
    (sortChanged)="onColumnSortingChanged($event)"
    (cellClicked)="onCellClicked($event)"
    [rowData]="rowData"></ag-grid-angular>
</div>
