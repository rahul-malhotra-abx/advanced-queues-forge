<div class="assignee-multiselect-dropdown">
  <div style="position: absolute;">
    <div class="multiselect-dropdown" *ngIf="!editing">
      <span class="dropdown-btn" (click)="startEditing($event)">
        <div class="selected-item">
          <img [src]="selectedItems[0]?.avatarUrl" style="width: 18px; margin-right: 2px;" />
          {{ selectedItems[0]?.displayName }}
        </div>
      </span>
    </div>
    <ng-multiselect-dropdown *ngIf="editing" id="two" [settings]="dropdownSettings" [data]="assignees"
      [ngModel]="selectedItems" (onSelect)="onAssigneeChange($event)" (onDropDownClose)="editing = false">
      <ng-template #optionsTemplate let-item let-option="option" let-id="id" let-isSelected="isSelected">
        <div style="padding:1px 10px;margin-right:10px;right:2px;top:-2px; display: flex; align-items: center;">
          <img [src]="assigneesById[id]?.avatarUrl" style="width: 18px; margin: 0 20px;" />
          <label style="color: #333;min-width: 130px;font-weight:normal">{{ assigneesById[id]?.displayName }}</label>
        </div>
      </ng-template>
      <ng-template #optionSelectedTemplate let-option="option" let-id="id">
        <div>
          <img [src]="assigneesById[id]?.avatarUrl" style="width: 18px; margin-right: 2px;" />
          {{ option }}
        </div>
      </ng-template>
    </ng-multiselect-dropdown>
  </div>
</div>
