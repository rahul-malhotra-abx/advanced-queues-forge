<router-outlet></router-outlet>

<!--
  An unlicensed user is never routed into the app (app.component.ts). The
  outlet stays because the router needs it, and styles.scss hides anything the
  router renders on its own; see html.aq-unlicensed.

  No logo and no wordmark. Every surface this renders in already names the app
  in its own header directly above, so a lockup here only repeats it.
-->
<div class="aq-licence-gate" *ngIf="licensed === false">
  <h1>You don't have a valid licence</h1>
  <p>There seems to be an issue with your Advanced Queues for Jira Service Management licence. Contact your admin to verify the licence.</p>
</div>
